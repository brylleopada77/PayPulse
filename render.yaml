# Render Blueprint: deploys the PayPulse web app (always-on public link, any device).
# Render dashboard -> New -> Blueprint -> pick this repository and branch.
#
# The database is NOT a Render database (the free one is deleted after 30 days): use a free Neon
# PostgreSQL (https://neon.tech, no expiry) and paste its DIRECT connection string (the host without
# "-pooler": real-time notifications need LISTEN/NOTIFY) into DATABASE_URL when Render asks.
# Tables are created / upgraded automatically on every start (db:init is idempotent).
services:
  - type: web
    name: paypulse
    runtime: node
    plan: free
    region: singapore          # closest to the Philippines
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    autoDeploy: true           # every push to the deployed branch updates the live app
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/paypulse?sslmode=require
        sync: false
      - key: ADMIN_EMAILS      # your email: admin role (Add money, QA tools)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      # Encrypts virtual card numbers at rest (PCI-DSS style); never reuse JWT_SECRET for this.
      - key: CARD_ENCRYPTION_KEY
        generateValue: true
      # Demo / portfolio deployment: play money. Mock "Add money" and the QA sandbox are admin-only.
      - key: MOCK_PAYMENTS
        value: "true"
      - key: QA_SANDBOX
        value: "true"
