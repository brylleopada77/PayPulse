name: PayPulse Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # PayPulse has a KNOWN race-condition bug in POST /api/transfers (see QA_NOTES.md).
  # While this is "true", the race tests are expected to fail and don't block the PR.
  # After the bug is fixed, set it to "false" so the race tests become hard gates.
  RACE_BUG_EXPECTED: "true"
  BASE_URL: http://localhost:3000
  DATABASE_URL: postgres://paypulse:paypulse@localhost:5432/paypulse
  WEBHOOK_SECRET: ci-webhook-secret
  JWT_SECRET: ci-jwt-secret

jobs:
  test:
    name: API, concurrency & ledger tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Start app + database (Docker Compose)
        run: docker compose up -d --build --wait

      - name: Show running containers
        run: |
          docker compose ps
          curl --fail --silent http://localhost:3000/health

      - name: Run Playwright API tests
        run: npx playwright test

      - name: Run k6 concurrency test
        id: k6
        continue-on-error: ${{ env.RACE_BUG_EXPECTED == 'true' }}
        run: |
          mkdir -p reports && chmod 777 reports
          docker compose run --rm k6

      - name: Check database ledger is balanced
        id: dbcheck
        continue-on-error: ${{ env.RACE_BUG_EXPECTED == 'true' }}
        run: npm run db:check

      - name: Note known bug results
        if: always()
        run: |
          {
            echo "## PayPulse test summary"
            echo "- Known race bug expected: \`${RACE_BUG_EXPECTED}\`"
            echo "- k6 concurrency test: \`${{ steps.k6.outcome }}\`"
            echo "- Database ledger check: \`${{ steps.dbcheck.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save container logs
        if: failure()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-compose.log

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: paypulse-test-reports
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose down -v
